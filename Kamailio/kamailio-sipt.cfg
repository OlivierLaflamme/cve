#!KAMAILIO
debug=3
log_stderror=yes
memdbg=5
memlog=5
children=1
listen=udp:0.0.0.0:5060

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "sipt.so"

request_route {
    if(is_method("OPTIONS") && uri==myself && $rU==$null) {
        sl_send_reply("200", "Keepalive");
        exit;
    }

    if(is_method("INVITE")) {
        sipt_destination($rU, "31", "1");
        xlog("SIPT calling: $sipt(calling_party_number)\n");
    }

    sl_send_reply("200", "OK");
    exit;
}
