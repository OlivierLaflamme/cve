#!KAMAILIO
debug=3
log_stderror=yes
memdbg=5
memlog=5
children=1
listen=udp:0.0.0.0:5060

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "xlog.so"
loadmodule "db_text.so"
loadmodule "imc.so"

modparam("imc", "db_url", "text:///tmp/kamailio_db")
modparam("tm", "fr_timer", 2000)

request_route {
    if(is_method("OPTIONS") && uri==myself && $rU==$null) {
        sl_send_reply("200", "Keepalive");
        exit;
    }

    if(is_method("MESSAGE")) {
        imc_manager();
        sl_send_reply("200", "OK");
        exit;
    }

    sl_send_reply("200", "OK");
    exit;
}
